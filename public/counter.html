<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Counter — THE KD'S CAFE</title>
<style>
  :root { --primary: #d9480f; --bg: #12100f; --card: #1e1b1a; --text: #f5f1ee; --muted: #9a918c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 440px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 20px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .card.full { grid-column: 1 / -1; text-align: center; }
  .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .amount { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
  .amount.big { font-size: 3rem; }
  .divider { width: 100%; max-width: 440px; border: none; border-top: 1px solid #2c2725; margin: 20px 0; }
  .date-row { display: flex; gap: 10px; width: 100%; max-width: 440px; }
  .date-row input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1.5px solid #2c2725;
    background: var(--card); color: var(--text); font-size: 0.95rem; color-scheme: dark;
  }
  .date-row input:focus { outline: none; border-color: var(--primary); }
  .date-row button {
    padding: 11px 20px; border-radius: 10px; border: none;
    background: var(--primary); color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer;
  }
  .refresh-btn {
    margin-top: 20px; padding: 10px 28px; border-radius: 10px; border: none;
    background: #2c2725; color: var(--text); font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .note { margin-top: 18px; font-size: 0.75rem; color: var(--muted); text-align: center; line-height: 1.6; max-width: 360px; }
  .err { color: #ff8787; font-size: 0.85rem; margin-top: 12px; }
</style>
</head>
<body>
<h1>THE KD'S CAFE — DAILY COUNTER</h1>

<div class="grid">
  <div class="card full">
    <div class="label">Today's Collection</div>
    <div class="amount big" id="todayAmt">₹—</div>
    <div id="dateLabel" style="font-size:0.8rem;color:var(--muted);margin-top:6px;"></div>
  </div>
  <div class="card">
    <div class="label">Yesterday</div>
    <div class="amount" id="yAmt">₹—</div>
  </div>
  <div class="card">
    <div class="label" id="monthLbl">This Month</div>
    <div class="amount" id="mAmt">₹—</div>
  </div>
</div>

<hr class="divider" />

<div class="date-row">
  <input id="datePick" type="date" />
  <button onclick="load(document.getElementById('datePick').value)">Show</button>
</div>

<button class="refresh-btn" onclick="load()">↻ Refresh</button>
<div class="err" id="err"></div>

<p class="note">
  Amount is added when you press <strong>Clear Table</strong> on the dashboard.<br/>
  Printing a bill does not change this counter.
</p>

<script>
  const money = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });

  async function load(date) {
    document.getElementById("err").textContent = "";
    try {
      const res = await fetch("/api/counter", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify(date ? { date } : {})
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || "Error " + res.status);

      document.getElementById("todayAmt").textContent = money(d.today);
      document.getElementById("yAmt").textContent     = money(d.yesterday);
      document.getElementById("mAmt").textContent     = money(d.month);
      document.getElementById("dateLabel").textContent = d.date;
      document.getElementById("datePick").value        = d.date;

      if (d.monthLabel) {
        const [y, m] = d.monthLabel.split("-");
        const name = new Date(+y, +m - 1, 1).toLocaleString([], { month: "long" });
        document.getElementById("monthLbl").textContent = name + " Total";
      }
    } catch (e) {
      document.getElementById("err").textContent = e.message;
    }
  }

  load();
</script>
</body>
</html>
