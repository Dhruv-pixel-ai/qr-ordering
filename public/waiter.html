<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waiter — Take Order</title>
<link rel="stylesheet" href="menu.css" />
<link rel="stylesheet" href="waiter.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🧑‍💼 Take Order</h1>
      <p class="table-badge">For a customer at the table</p>
    </div>
    <button id="cartBtn" class="cart-btn">🛒 <span id="cartCount">0</span></button>
  </header>

  <div class="waiter-fields">
    <label>Table No.
      <select id="tableSelect"></select>
    </label>
    <label>Customer Name
      <input id="customerName" type="text" placeholder="e.g. Rahul" required />
    </label>
    <label>Waiter Name (optional)
      <input id="waiterName" type="text" placeholder="e.g. Suresh" />
    </label>
  </div>

  <div id="categoryTabs" class="tabs"></div>

  <main id="menuList" class="menu-list"></main>

  <div id="cartDrawer" class="cart-drawer hidden">
    <div class="cart-header">
      <h2>Order Summary</h2>
      <button id="closeCart">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <textarea id="orderNote" placeholder="Any special instructions? (optional)"></textarea>
    <div class="cart-footer">
      <div class="cart-total">Total: ₹<span id="cartTotal">0</span></div>
      <button id="placeOrderBtn" class="place-order-btn">Submit Order</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="waiter.js"></script>
</body>
</html>
