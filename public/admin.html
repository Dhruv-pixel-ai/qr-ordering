<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>THE KD'S CAFE — Dashboard</title>
<link rel="stylesheet" href="admin.css" />
<!-- QZ Tray: enables silent printing to specific printers without a dialog -->
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>👨‍🍳 Restaurant Dashboard</h1>
    <div class="header-right">
      <span id="connStatus" class="status-dot"></span>
      <a href="/menu-manager.html" class="link-btn">Manage Menu</a>
      <a href="/waiter.html" class="link-btn">Take Order (Waiter)</a>
      <a href="/qr.html" class="link-btn">Table QR Codes</a>
      <a href="/printer-settings.html" class="link-btn" id="printerSettingsBtn">🖨️ Printers</a>
      <span class="printer-status-wrap" title="Printer status">
        <span class="printer-dot" id="kitchenDot" title="Kitchen printer"></span>
        <span class="printer-dot" id="counterDot" title="Counter printer"></span>
      </span>
    </div>
  </header>

  <div id="soundBanner" class="sound-banner" style="display:none;">
    🔔 Click anywhere on this page once to enable the new-order sound
    (your browser blocks audio until then).
  </div>

  <main id="tablesGrid" class="tables-grid"></main>

  <div id="billModal" class="modal hidden">
    <div class="modal-content" id="billContent"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="admin.js"></script>
</body>
</html>
